[package]
name = "disrust"
version = "0.2.0"
edition = "2024"
publish = false

[[bin]]
name = "DisRust"
path = "src/main.rs"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
winresource = "0.1.34"

[profile.release]
lto = "thin"
strip = "symbols"
