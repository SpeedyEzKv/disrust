[package]
name = "noir-chat"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
tao = { version = "0.37.3", default-features = false, features = ["rwh_06"] }
url = "2.5"
webview2-com = "0.39"
windows = { version = "0.62", features = ["Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
wry = { version = "0.57.3", default-features = false }

[build-dependencies]
winresource = "0.1.34"

[profile.release]
lto = "thin"
strip = "symbols"
