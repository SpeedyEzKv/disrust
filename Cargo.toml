[package]
name = "disrust"
version = "0.3.0"
edition = "2024"
publish = false

[[bin]]
name = "DisRust"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
eframe = { version = "0.32", default-features = false, features = ["default_fonts", "glow", "x11"] }
getrandom = "0.3"
image = { version = "0.25", default-features = false, features = ["png"] }
open = "5"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
tiny_http = "0.12"
url = "2"

[build-dependencies]
winresource = "0.1.34"

[profile.release]
lto = "thin"
strip = "symbols"
